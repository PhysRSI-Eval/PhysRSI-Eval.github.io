<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PhysRSI-Eval. Coming soon.">
  <meta name="color-scheme" content="light">
  <title>PhysRSI-Eval — Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f3ed; color: #222c28; font-family: Georgia, 'Times New Roman', serif; }
    .page { min-height: 100vh; min-height: 100svh; padding: 36px 6vw; display: flex; flex-direction: column; }
    header, footer { display: flex; justify-content: space-between; gap: 24px; font-family: 'Courier New', monospace; font-size: 12px; }
    header { padding-bottom: 22px; border-bottom: 1px solid #c9cec4; align-items: center; }
    .brand { font-size: 17px; font-weight: bold; letter-spacing: -.6px; }
    .status { display: flex; align-items: center; gap: 8px; }
    .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #5a7552; }
    main { flex: 1; display: grid; align-content: center; padding: 90px 0; }
    .eyebrow { color: #60705c; font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
    h1 { font-size: clamp(64px, 12vw, 172px); line-height: .96; font-weight: normal; letter-spacing: -.065em; margin: 28px 0 34px; }
    h1 span { display: block; font-style: italic; color: #60705c; }
    .description { font-size: clamp(17px, 2vw, 22px); line-height: 1.6; color: #60665e; margin: 0; max-width: 34em; }
    footer { border-top: 1px solid #c9cec4; padding-top: 22px; color: #666e63; line-height: 1.6; }
    @media (max-width: 480px) { .page { padding: 24px; } header, footer { font-size: 10px; } .brand { font-size: 15px; } main { padding: 70px 0; } }
  </style>
</head>
<body>
  <div class="page">
    <header><div class="brand">PhysRSI-Eval</div><div class="status">In preparation</div></header>
    <main>
      <p class="eyebrow">PhysRSI-Eval</p>
      <h1>Coming<span>soon.</span></h1>
      <p class="description">We’re preparing something new.<br>More details will be available here soon.</p>
    </main>
    <footer><span>PhysRSI-Eval</span><span>Stay curious. Stay tuned.</span></footer>
  </div>
</body>
</html>
